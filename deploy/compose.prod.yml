# Heldar — PRODUCTION overlay. Layer ON TOP of compose.yml:
#
#   docker login ghcr.io                                        # private full images
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# Swaps in the FULL (private) images (kernel + generic apps + proprietary verticals) and turns on the
# hardened auth posture. Put HELDAR_SECRET_KEY (openssl rand -base64 32) and HELDAR_CORS_ORIGINS in .env.
# If this box is reachable from the internet, also set the remote-access vars (see docs/PRODUCTION.md);
# the kernel then refuses to boot with auth off.
name: heldar

services:
  core:
    image: ghcr.io/straits-ai/heldar-core-full:${HELDAR_VERSION:-latest}
    environment:
      HELDAR_AUTH_ENABLED: "true"
      HELDAR_AUTH_COOKIE_SECURE: "true"
      HELDAR_STRICT_PROD: "true"
      HELDAR_SESSION_TTL_HOURS: "4"
      HELDAR_SESSION_IDLE_TIMEOUT_MIN: "30"
      # HELDAR_SECRET_KEY + HELDAR_CORS_ORIGINS come from .env (secrets never live in a committed file).

  web:
    image: ghcr.io/straits-ai/heldar-web-full:${HELDAR_VERSION:-latest}
