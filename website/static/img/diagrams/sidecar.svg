<svg viewBox="0 0 680 264" width="680" height="264" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Heldar Core and a sidecar plugin</title>
  <desc>Heldar Core sends signed webhook events and health probes to your sidecar; the sidecar serves UI and API reverse-proxied under /m/{id}/* and calls back into the kernel API with a minted bearer key.</desc>
  <defs>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#1a1206" flood-opacity="0.20"/>
    </filter>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="#78716c" stroke-width="1.6" fill="none">
    <path d="M232,86 L448,86" marker-end="url(#ah2)"/>
    <path d="M232,120 L448,120" marker-end="url(#ah2)"/>
    <path d="M448,154 L232,154" marker-end="url(#ah2)"/>
    <path d="M448,188 L232,188" marker-end="url(#ah2)"/>
  </g>
  <!-- edge labels (white backing reads on any theme) -->
  <g font-size="11" fill="#44403c" text-anchor="middle">
    <rect x="262" y="71" width="156" height="17" rx="3" fill="#ffffff" opacity="0.9"/><text x="340" y="83">webhook · signed events</text>
    <rect x="268" y="105" width="144" height="17" rx="3" fill="#ffffff" opacity="0.9"/><text x="340" y="117">GET /heldar/health · probe</text>
    <rect x="266" y="139" width="148" height="17" rx="3" fill="#ffffff" opacity="0.9"/><text x="340" y="151">reverse-proxy: UI + API</text>
    <rect x="266" y="173" width="148" height="17" rx="3" fill="#ffffff" opacity="0.9"/><text x="340" y="185">kernel API · Bearer key</text>
  </g>

  <!-- Heldar Core (amber hero) -->
  <g filter="url(#ds2)">
    <rect x="50" y="68" width="180" height="138" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="140" y="133" font-size="15" font-weight="bold" fill="#78350f">Heldar Core</text>
    <text x="140" y="154" font-size="12" fill="#92400e">/m/{id}/*</text>
  </g>

  <!-- your sidecar (neutral = third-party) -->
  <g filter="url(#ds2)">
    <rect x="450" y="68" width="180" height="138" rx="7" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle">
    <text x="540" y="130" font-size="14" font-weight="bold" fill="#3f3f46">your sidecar</text>
    <text x="540" y="148" font-size="11" fill="#71717a">any language</text>
    <text x="540" y="164" font-size="11" fill="#71717a">:9123</text>
  </g>
</svg>
