<svg viewBox="0 0 680 372" width="680" height="372" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Heldar open-core architecture</title>
  <desc>Cameras and the AI worker feed the Apache-2.0 heldar-kernel, which is consumed by the open generic apps (heldar-entry, heldar-movement, heldar-search) and the proprietary verticals.</desc>
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#1a1206" flood-opacity="0.20"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
  </defs>

  <g stroke="#78716c" stroke-width="1.6" fill="none">
    <path d="M195,70 L195,138" marker-end="url(#ah)"/>
    <path d="M485,70 L485,138" marker-end="url(#ah)"/>
    <path d="M120,228 L120,284" marker-end="url(#ah)"/>
    <path d="M285,228 L285,284" marker-end="url(#ah)"/>
    <path d="M450,228 L450,284" marker-end="url(#ah)"/>
    <path d="M605,228 L605,284" marker-end="url(#ah)"/>
  </g>
  <g font-size="11" fill="#44403c" text-anchor="middle">
    <rect x="172" y="95" width="46" height="17" rx="3" fill="#ffffff" opacity="0.9"/><text x="195" y="107">RTSP</text>
    <rect x="450" y="95" width="70" height="17" rx="3" fill="#ffffff" opacity="0.9"/><text x="485" y="107">/ai/events</text>
  </g>

  <!-- inputs (neutral) -->
  <g filter="url(#ds)">
    <rect x="110" y="26" width="170" height="44" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.4"/>
    <rect x="400" y="26" width="170" height="44" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle">
    <text x="195" y="53" font-size="13.5" font-weight="bold" fill="#3f3f46">Cameras</text>
    <text x="485" y="46" font-size="13.5" font-weight="bold" fill="#3f3f46">AI worker</text>
    <text x="485" y="61" font-size="10.5" fill="#71717a">apps/ai · HTTP client</text>
  </g>

  <!-- kernel (amber hero) -->
  <g filter="url(#ds)">
    <rect x="70" y="140" width="540" height="86" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="340" y="172" font-size="15" font-weight="bold" fill="#78350f">heldar-kernel · Apache-2.0</text>
    <text x="340" y="194" font-size="11" fill="#92400e">media + DVR · perception ingest + sampler · zones</text>
    <text x="340" y="209" font-size="11" fill="#92400e">auth / RBAC · observability · retention · SDK seams</text>
  </g>

  <!-- open apps (light amber) -->
  <g filter="url(#ds)">
    <rect x="44" y="286" width="152" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <rect x="209" y="286" width="152" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <rect x="374" y="286" width="152" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle">
    <text x="120" y="313" font-size="12.5" font-weight="bold" fill="#92400e">heldar-entry</text>
    <text x="120" y="329" font-size="10.5" fill="#b45309">access control</text>
    <text x="285" y="313" font-size="12.5" font-weight="bold" fill="#92400e">heldar-movement</text>
    <text x="285" y="329" font-size="10.5" fill="#b45309">ReID / breach</text>
    <text x="450" y="313" font-size="12.5" font-weight="bold" fill="#92400e">heldar-search</text>
    <text x="450" y="329" font-size="10.5" fill="#b45309">semantic search</text>
  </g>

  <!-- proprietary verticals (dashed = separate/private) -->
  <g filter="url(#ds)">
    <rect x="539" y="286" width="132" height="64" rx="6" fill="#fafaf9" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle">
    <text x="605" y="311" font-size="12" font-weight="bold" fill="#57534e">Proprietary</text>
    <text x="605" y="326" font-size="12" font-weight="bold" fill="#57534e">verticals</text>
    <text x="605" y="341" font-size="9.5" fill="#78716c">private crates</text>
  </g>
</svg>
