# VisionOps Cargo workspace (open-core).
#
# Apache-2.0 open tier: `visionops-kernel` (domain-agnostic platform) + the generic reference apps
# `visionops-entry` (access control), `visionops-movement`, `visionops-search`, and the reference
# composing bin `visionops-server`. Proprietary verticals (`visionops-bakery`; future
# `visionops-campus-*`) depend on the open crates and are gated out of the open build via the server's
# `verticals` feature. See LICENSING.md + docs/OPEN-CORE-SPLIT.md.
[workspace]
resolver = "2"
members = [
    "crates/visionops-kernel",
    "crates/visionops-entry",
    "crates/visionops-bakery",
    "crates/visionops-movement",
    "crates/visionops-search",
    "crates/visionops-server",
]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 2
