[package]
name = "visionops-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "VisionOps Core — media kernel control plane (Stage 0): camera registry, RTSP ingest, recording, timeline index, playback, live view, health."
license = "Proprietary"

[[bin]]
name = "visionops-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
libc = "0.2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 2
