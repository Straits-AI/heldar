<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23f59e0b' stroke-width='2.25'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f59e0b'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />

    <!-- Fonts: Archivo (display), Hanken Grotesk (UI), JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Heldar Core</title>

    <!--
      Runtime import map: resolves bare react / react-dom / react-router-dom specifiers for
      dynamically-loaded module bundles so every module shares one React instance.

      FALLBACK path (Vite 8 / Rolldown blocker): Rolldown wraps all chunks in an internal module
      system — the react.js chunk does NOT export { useState, useEffect, … } as standard named ES
      exports, so pointing the import map directly at the shell chunk fails. Instead we point each
      specifier at a thin shim (public/modules/*-shim.js) that re-exports from window globals set
      by main.tsx before any module bundle loads.

      The map is injected at runtime so the base path (/ on appliance, /app/ on remote dashboard)
      is handled correctly without a rebuild.
    -->
    <script>
      const b = document.querySelector('base')?.getAttribute('href') || '/';
      const map = { imports: {
        "react":              b + "modules/react-shim.js",
        "react-dom":          b + "modules/react-dom-shim.js",
        "react-dom/client":   b + "modules/react-dom-client-shim.js",
        "react/jsx-runtime":  b + "modules/react-jsx-runtime-shim.js",
        "react-router-dom":   b + "modules/react-router-dom-shim.js",
        "@heldar/shell":      b + "modules/shell-shim.js"
      }};
      const s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify(map);
      document.currentScript.after(s);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
