# nginx config for the Heldar dashboard container.
# Serves the built SPA and proxies API/media/health to the control plane on 127.0.0.1:8000.
#
# Rendered at container start from /etc/nginx/templates by the official image's envsubst step.
# NGINX_LISTEN defaults to `8080` (all interfaces — the plain-HTTP LAN dashboard) and is overridden
# to `127.0.0.1:8080` by deploy/compose.tls.yml, where Caddy is the only network-facing listener.
# NGINX_ENVSUBST_FILTER (set in the Dockerfile) restricts substitution to NGINX_* so nginx's own
# runtime variables like $uri and $host survive untouched.
server {
    listen ${NGINX_LISTEN};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/      { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location /media/    { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location = /healthz { proxy_pass http://127.0.0.1:8000; }
}
