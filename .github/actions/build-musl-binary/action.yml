name: Build static musl heldar binaries
description: Cross-compile heldar-core and heldarctl for a musl target, then name and checksum them.
inputs:
  target:
    description: Rust target triple (e.g. x86_64-unknown-linux-musl)
    required: true
  arch-label:
    description: Human arch label for the asset name (e.g. x86_64)
    required: true
  version:
    description: Release tag (e.g. v0.2.0)
    required: true
outputs:
  asset:
    description: Path to the named heldar-core binary asset
  cli-asset:
    description: Path to the named heldarctl binary asset
    value: ${{ steps.package.outputs.asset }}
runs:
  using: composite
  steps:
    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: musl-${{ inputs.target }}
    - name: Build (static musl)
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: cross build --release --locked --target "$TARGET" -p heldar-server -p heldarctl
    - name: Package + checksum
      id: package
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch-label }}
      run: |
        set -euo pipefail
        # heldarctl ships for the SAME architectures as the core binary (#122). A CLI that is not
        # on the box an installer is standing in front of is not the supported interface, whatever
        # the docs say.
        assets=()
        for name in heldar-core heldarctl; do
          bin="target/$TARGET/release/$name"
          test -f "$bin" || { echo "::error::binary not found: $bin"; exit 1; }
          asset="$name-$VERSION-$ARCH-linux-musl"
          cp "$bin" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          assets+=("$asset")
        done
        # `asset` stays the CORE binary so the SBOM/attestation steps downstream are unchanged.
        echo "asset=heldar-core-$VERSION-$ARCH-linux-musl" >> "$GITHUB_OUTPUT"
        echo "cli-asset=heldarctl-$VERSION-$ARCH-linux-musl" >> "$GITHUB_OUTPUT"
