name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt · clippy · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The evidence-bundle tests (#118) build a REAL bundle: a synthetic segment via ffmpeg, a
      # remux, a zip and an openssl signature check. They deliberately fail rather than skip when a
      # tool is missing — a test that quietly skips in CI is indistinguishable from one that passes,
      # and this suite is the only thing standing between a tampered bundle and a "VALID" verdict.
      - name: install ffmpeg (evidence bundle tests remux real media)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg zip unzip
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked
      - name: heldarctl builds and its help is honest about exit codes
        run: |
          set -euo pipefail
          cargo build --locked --bin heldarctl
          # The documented exit codes are a contract a script branches on; a help text that has
          # drifted from them is worse than none.
          ./target/debug/heldarctl help | grep -q "5 blocking findings"
          ./target/debug/heldarctl version --json | grep -q '"contract"'
          # An unknown command is a usage error, not a crash.
          set +e; ./target/debug/heldarctl nonsense >/dev/null 2>&1; test $? -eq 1
          set -e
          # The dry-run default is the CLI's entire safety story for a mutation (#122). If the help
          # stops saying so, an operator reading --help learns that running it applies the change.
          ./target/debug/heldarctl help | grep -q "A MUTATION IS A DRY RUN UNTIL YOU SAY OTHERWISE"
          ./target/debug/heldarctl help | grep -q "heldarctl retention set"
      - name: skill bundle lints (#124)
        run: |
          set -euo pipefail
          # Every skill's permitted tools are checked against heldar-mcp's ACTUAL tool table, so a
          # skill cannot name a tool that does not exist — an invented tool becomes an invented
          # RESULT the moment a model decides to be helpful.
          # The API-path check needs the served document, so write it first — otherwise that
          # half of the lint silently skips and the step reports success having checked less.
          cargo test -p heldar-server --test openapi_contract write_the_served_document --locked
          python3 scripts/validate_skills.py
      - name: capacity claims are backed by a run that passed (#119)
        run: |
          set -euo pipefail
          # docs/sizing.md tells people how many cameras a box will carry, and someone buys
          # hardware against that sentence. Every row must cite a run that PASSED, or say
          # EXTRAPOLATED. The verdict is recomputed from the run's raw measurements rather than
          # read from its `verdict` field, and a run judged against different thresholds from the
          # ones in the tree today does not count — so loosening a bar to turn a red run green
          # invalidates the claim it was loosened for.
          python3 scripts/bench/test_harness.py
          python3 scripts/bench/test_capacity_gate.py
          python3 scripts/verify_capacity_claims.py
          # Documented metric names must match the exposition, both ways. An alerting rule copied
          # from a drifted table matches nothing and never fires, which looks exactly like health.
          # Two places pinning the same dependency must agree. #87 bumped the composed Caddy
          # image and left scripts/setup_caddy.sh behind, so the required TLS e2e check went green
          # having installed the OLD Caddy — a passing check about a version the change was not
          # making.
          # A release asset must not be silently replaced under a tag consumers have pinned.
          ./scripts/test_release_upload.sh
          python3 scripts/test_pinned_versions.py
          python3 scripts/check_pinned_versions.py
          python3 scripts/bench/test_doc_drift.py
          python3 scripts/check_documented_metrics.py
          # The AI dependency locks are what the blocking audit actually reads (#114). A lock that
          # has drifted from its requirements file keeps the gate green while covering last month's
          # tree — the guard makes that a build failure, and these controls prove the guard can fail.
          python3 scripts/test_ai_locks.py
          python3 scripts/check_ai_locks.py
          # The exceptions register is EMPTY and should stay that way, which makes its controls the
          # only thing that ever exercises the validator. Without them, the first real suppression
          # would be the first time this code ran — on the day someone is unblocking a release.
          python3 scripts/test_security_exceptions.py
          python3 scripts/check_security_exceptions.py
          # The Trivy gate did not block for a long time — `exit-code` was unset, so it reported
          # findings and returned 0. It blocks now and self-tests itself against a seeded fixture;
          # this guard is what stops the self-test rotting into a test of a config nobody ships.
          # Needs a real YAML parser: the step/`with`/`id` nesting it inspects is exactly where a
          # hand-rolled one would go quietly wrong, which is the failure it exists to prevent.
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/test_trivy_gate.py
          python3 scripts/check_trivy_gate.py
          # Publishing is irreversible — a crates.io version cannot be replaced and an image tag is
          # pulled by whoever trusts it — so every publishing job must depend on a green security
          # run for its exact commit. Detaching that gate is a ONE-LINE deletion with nothing
          # alarming in the diff, which is why it needs a guard rather than a review convention.
          # The action's own decision logic runs only during a release, so it is driven here against
          # a stubbed API instead of first executing when someone is trying to ship.
          ./scripts/test_require_security_run.sh
          python3 scripts/test_release_gated.py
          python3 scripts/check_release_gated.py
      - name: read-seam lint (cross-app reads go through *_read views)
        run: ./scripts/check-read-seam.sh
      # A generated client that COMPILES is a stronger statement about the contract than any prose:
      # a $ref to a missing schema, an operation with no id, or a duplicate operationId all become
      # build failures here instead of a surprise for whoever generates a client later. The first
      # run of this found two real defects — a field named `from` (a keyword in two of the three
      # languages) and three duplicated operationIds that silently collapsed a method.
      - name: generate API clients
        run: python3 scripts/gen_clients.py target/openapi.json clients
      - name: rust client compiles
        run: cargo build --quiet --manifest-path clients/rust/Cargo.toml
      - name: python client imports
        run: python3 -c "import sys; sys.path.insert(0,'clients/python'); import heldar_client"
      - name: generated clients are in sync with the contract
        run: |
          set -euo pipefail
          if ! git diff --quiet -- clients; then
            echo "The committed clients differ from what the contract generates:"
            git --no-pager diff --stat -- clients
            echo
            echo "Regenerate and commit:  python3 scripts/gen_clients.py target/openapi.json clients"
            exit 1
          fi

      # The API contract, compared against the one the last release published. Breaking changes are
      # ALLOWED on this pre-1.0 appliance — what is not allowed is shipping one by accident, because
      # it breaks a generated client at runtime in someone else's deployment. `continue-on-error`
      # while the baseline does not exist yet: a release has to publish one before this can enforce.
      - name: composite-action outputs resolve to something real
        # An `outputs:` entry with no `value` is valid syntax that always yields "". The release
        # action shipped exactly that for two merges; nothing would have noticed until release day.
        run: |
          set -euo pipefail
          python3 scripts/test_action_outputs.py
          python3 scripts/check_action_outputs.py
      - name: the contract-diff classifier is correct in both directions
        # A false "breaking" trains people to ignore the diff; a false "additive" is how a break
        # ships. Both directions are pinned, including that response and request schemas are judged
        # by opposite rules (#156).
        run: python3 scripts/test_openapi_diff.py
      - name: api contract diff (against the last release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh release download --pattern openapi.json --dir /tmp/baseline 2>/dev/null; then
            python3 scripts/openapi_diff.py /tmp/baseline/openapi.json target/openapi.json
          else
            echo "no published openapi.json to compare against yet — the next release creates one"
          fi
      - name: open build (no proprietary verticals) compiles
        run: cargo build -p heldar-server --no-default-features --locked
      - name: open build stays lean (no wasm runtime linked by default)
        run: |
          if cargo tree -p heldar-server --no-default-features | grep -q wasmi; then
            echo "::error::wasmi is linked into the default/open heldar-server build"; exit 1
          fi
      - name: wasm plugin host compiles + lints
        run: cargo clippy -p heldar-server --features wasm --all-targets --locked -- -D warnings

  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 (rsa, Marvin timing side-channel): UNREACHABLE — `rsa` is pulled
          # into Cargo.lock only by `sqlx-mysql`, and this is a sqlite-only build
          # (sqlx default-features = false), so the vulnerable RSA code is never compiled.
          # No upstream fix exists. Re-evaluate (and drop this ignore) if a MySQL/Postgres
          # driver is ever enabled, or once a fixed `rsa` ships. Verify unreachability with:
          #   cargo tree -i rsa --all-features   # -> "nothing to print"
          ignore: RUSTSEC-2023-0071

  ai:
    name: ai worker (unit, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The OLDEST version apps/ai/README.md promises, and the one the shipped image runs. A
        # requirements floor that quietly drops the documented minimum is otherwise invisible:
        # Dependabot #77 proposed `numpy>=2.5.1`, which cannot be installed on Python 3.11 at all
        # (it requires >=3.12), while the README says 3.10+ and the worker runs there today. Nothing
        # would have caught that — the Dockerfile pins one version and pip-audit pinned another.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
      # Core deps only — the same three the shipped image installs. The heavy stacks (ultralytics,
      # paddleocr, torch) are lazily imported and deliberately NOT installed here; the OCR tests
      # inject fakes for both PaddleOCR majors precisely so they need neither.
      - run: pip install -r apps/ai/requirements-core.txt
      # apps/ai had NO tests and was in no CI job at all, which is how #188 shipped: a fresh install
      # resolves PaddleOCR 3.x, the code targeted 2.x, and every failure was swallowed — the worker
      # emitted vehicles with no plate forever while looking healthy. Not a crash, so only an
      # assertion catches it.
      # Every test_*.py, not a hand-listed set: `test_ocr_backend.py` was named explicitly here,
      # so `test_thread_attrs.py` would have been added to the repo and run by nobody. The count
      # assertion is the point — a glob that matches nothing otherwise "passes".
      - name: unit tests
        run: |
          shopt -s nullglob
          tests=(apps/ai/test_*.py)
          (( ${#tests[@]} >= 2 )) || { echo "::error::expected at least 2 apps/ai test files, found ${#tests[@]}"; exit 1; }
          for t in "${tests[@]}"; do echo "== $t"; python3 "$t"; done

  # NO PR JOB BUILT ANY DOCKERFILE until this one. `docker-open.yml` triggers on `push: tags: v*` or
  # manual dispatch, so a base-image bump first executed AT RELEASE TIME — which is how #98 (python
  # 3.13 -> 3.14) and #144 (node 22 -> 26) both arrived unverifiable: reviewable on paper, with the
  # decisive "does it build and run" unanswerable by anything in CI.
  #
  # Scoped to PRs that TOUCH a Dockerfile or its requirements, so it costs nothing on the other 95%
  # of changes. amd64 only — buildx cross-builds are slow on a runner, and the base images are
  # multi-arch indexes whose arm64 half differs only in the wheels pip resolves.
  images:
    name: container images build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the default of 1 leaves the base commit absent, so the diff below finds
      # nothing and the job skips itself on exactly the PRs it exists for. It did: the first run of
      # this job skipped on a PR that changed apps/ai/Dockerfile. Caught only because the skip
      # branch SAYS why; a silent no-op would have read as a pass.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          git rev-parse --verify "$base^{commit}" >/dev/null 2>&1 || {
            echo "::error::base commit $base is not present — cannot tell what changed, refusing to skip"
            exit 1
          }
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed" | sed 's/^/  changed: /'
          if echo "$changed" | grep -qE '(Dockerfile|requirements.*\.txt|package(-lock)?\.json)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no image inputs changed — skipping"
          fi
      - name: build the AI worker image
        if: steps.changed.outputs.run == 'true'
        run: docker build -f apps/ai/Dockerfile -t heldar-ai:ci apps/ai
      # The image is only useful if the worker actually starts in it. `--help` exercises argparse and
      # main(); importing worker.py exercises every module-level dependency, which is where a base
      # bump breaks (a wheel missing for the new Python, an ABI change).
      - name: the worker runs in it
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python heldar-ai:ci -c "import worker; print('worker imports OK')"
          docker run --rm heldar-ai:ci --help > /dev/null
          docker run --rm -v "$PWD/apps/ai/test_ocr_backend.py:/app/test_ocr_backend.py:ro" \
            --entrypoint python heldar-ai:ci test_ocr_backend.py
      - name: build the dashboard image
        if: steps.changed.outputs.run == 'true'
        run: docker build -f apps/web/Dockerfile -t heldar-web:ci apps/web

  web:
    name: web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      # Unit lane (vitest). Currently guards the sidecar bridge's containment check — the function that
      # decides what a sandboxed plugin may ask the host to fetch with the operator's session.
      - run: npm run test:unit
        working-directory: apps/web
      # The generated TypeScript client must typecheck under the same strictness as the dashboard.
      - name: typescript client compiles
        run: npx --yes -p typescript@5 tsc --noEmit --strict --target es2022 --lib es2022,dom --moduleResolution bundler --module esnext clients/typescript/heldar.ts
      - run: npm run build
        working-directory: apps/web

  e2e:
    name: playwright e2e (synthetic stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The e2e webServer (scripts/e2e_stack.sh) boots MediaMTX + synthetic ffmpeg cameras + the core.
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Provision the MediaMTX binary into infra/mediamtx/ exactly where the stack script expects it
      # ($ROOT/infra/mediamtx/mediamtx), auto-detecting the runner's OS/arch.
      - name: provision MediaMTX
        run: ./scripts/setup_mediamtx.sh
        env:
          # Raises the GitHub API rate limit from 60/hour per shared runner IP to 1000/hour.
          GITHUB_TOKEN: ${{ github.token }}
      # scripts/e2e_stack.sh runs the debug binary at target/debug/heldar-core.
      - name: build heldar-core (debug)
        run: cargo build --locked --bin heldar-core
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      # The stack serves the dashboard from apps/web/dist (HELDAR_WEB_DIR), so build it before the run.
      - name: build dashboard (dist for the stack)
        working-directory: apps/web
        run: npm run build
      - name: install Playwright chromium + system deps
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: playwright e2e
        working-directory: apps/web
        run: npm run test:e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The SECURE counterpart of the job above. It exists because that one runs HTTP with auth off, and
  # a mixed-content failure is structurally invisible in that configuration: MediaMTX serves HLS/WebRTC
  # on plaintext ports, so absolute http:// media URLs on an HTTPS dashboard are blocked by the browser
  # and live view dies. That regression shipped once already. This job serves the dashboard over real
  # TLS (Caddy, self-signed) with kernel auth ENABLED, so it can see it.
  e2e-tls:
    name: playwright e2e (HTTPS + auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: provision MediaMTX
        run: ./scripts/setup_mediamtx.sh
        env:
          # Raises the GitHub API rate limit from 60/hour per shared runner IP to 1000/hour.
          GITHUB_TOKEN: ${{ github.token }}
      # Caddy terminates the TLS the suite is about. The pinned version tracks deploy/compose.tls.yml.
      - name: provision Caddy
        run: ./scripts/setup_caddy.sh
      - name: build heldar-core (debug)
        run: cargo build --locked --bin heldar-core
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      - name: build dashboard (dist for the stack)
        working-directory: apps/web
        run: npm run build
      - name: install Playwright chromium + system deps
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: playwright e2e (TLS)
        working-directory: apps/web
        run: npm run test:e2e:tls
      - name: upload playwright report (TLS)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-tls
          path: apps/web/playwright-report/
          retention-days: 7

  integration:
    name: integration (validate.sh · rbac against synthetic camera)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Same provisioning as the e2e stack: MediaMTX binary + the debug core the scripts invoke.
      - name: provision MediaMTX
        run: ./scripts/setup_mediamtx.sh
        env:
          # Raises the GitHub API rate limit from 60/hour per shared runner IP to 1000/hour.
          GITHUB_TOKEN: ${{ github.token }}
      - name: build heldar-core (debug)
        run: cargo build --locked --bin heldar-core
      # Full media validation: boots MediaMTX + a synthetic RTSP camera + the core, records, and
      # exercises snapshot/clip/HLS. validate.sh was patched to track a failure counter and exit
      # non-zero on any failed Stage 0 guarantee, so this step fails CI on a bad build.
      - name: media validation (scripts/validate.sh)
        run: ./scripts/validate.sh
      # RBAC validation is fully self-contained: it starts its own auth-enabled core on :8001 with a
      # temp DB (no MediaMTX/camera needed) and prints PASS/FAIL lines. It does not exit non-zero on a
      # failed assertion, so gate on FAIL markers in its report.
      - name: rbac validation (scripts/validate_rbac.sh)
        run: |
          ./scripts/validate_rbac.sh
          if grep -Eq '(^|[[:space:]])FAIL ' data/validate_rbac.txt; then
            echo "::error::validate_rbac.sh reported one or more FAIL assertions"
            grep -E '(^|[[:space:]])FAIL ' data/validate_rbac.txt || true
            exit 1
          fi
      # Ingest-provenance validation is self-contained in the same way: it starts its own
      # auth-enabled cores on :8011 (enforce) and :8012 (warn) with temp DBs, needs no MediaMTX and no
      # camera, and prints PASS/FAIL lines. Both tiers are asserted, because "warn behaves exactly as
      # today" is as much a contract as "enforce refuses a ticketless batch". Same gating style as
      # validate_rbac.sh: it does not exit non-zero on a failed assertion, so gate on FAIL markers.
      - name: ingest provenance validation (scripts/validate_ingest_provenance.sh)
        run: |
          ./scripts/validate_ingest_provenance.sh
          if grep -Eq '(^|[[:space:]])FAIL ' data/validate_ingest_provenance.txt; then
            echo "::error::validate_ingest_provenance.sh reported one or more FAIL assertions"
            grep -E '(^|[[:space:]])FAIL ' data/validate_ingest_provenance.txt || true
            exit 1
          fi
      # Upgrade + disaster-recovery qualification. Boots PREVIOUS RELEASES' musl binaries against a
      # fresh DB, seeds through their API, then boots the current build on that same database — the only
      # test that exercises the migration chain against a database an older release actually wrote. Then
      # backup -> destroy -> restore, with a control boot proving the wipe was real (without it, a
      # restore that silently did nothing would still pass). Exits non-zero itself, so no FAIL-grep.
      - name: upgrade + restore drills (scripts/validate_upgrade_restore.sh)
        run: ./scripts/validate_upgrade_restore.sh
      - name: upload upgrade/restore report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-restore-report
          path: data/validate_upgrade_restore.txt
          retention-days: 7
      # The subsystem gate (#113): boots ONE synthetic stack and runs the zone, entry, movement and
      # search validations against it. Those four used to be skipped here for a harness reason — they
      # assumed a running dev box and a real camera — which was true, and also hid that they asserted
      # NOTHING. They logged HTTP codes for a human and exited 0 regardless, so running them would
      # have produced a gate that could not fail. validate_zones had been sending a `kind` the API
      # stopped accepting, creating no zone at all, and "passing" throughout.
      #
      # They assert now, and the gate refuses a script that produces no RESULT marker — "it ran" is
      # not "it passed".
      - name: subsystem gate (zones · entry · movement · search)
        run: ./scripts/validate_subsystems.sh
      # This job BLOCKS a merge as of #113, so its artifact is what someone debugs from at the moment
      # they are most stuck. It used to carry `validate_subsystems.txt` alone — the summary, without
      # the per-validator detail beneath it or a single line from the three processes the stack runs,
      # all of which were being written the whole time and thrown away.
      #
      # The frames are here because an AI failure is usually "what did the sampler actually see", and
      # that question is unanswerable from a log. They are synthetic `testsrc` output, so there is no
      # footage-handling concern in uploading them.
      - name: upload subsystem report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: subsystem-report
          path: |
            data/validate_*.txt
            data/subsys-core.log
            data/subsys-mediamtx.log
            data/subsys-synth.log
            data/ai_frame.jpg
            data/ai_chain_frame.jpg
          if-no-files-found: warn
          retention-days: 7
      # validate_ai.sh now runs in the subsystem gate above (#113). It was excluded for years on the
      # grounds that it "needs a REAL camera actively streaming"; that stopped being true when the
      # subsystem stack started publishing a synthetic RTSP stream for the whole run. Its frame check
      # is the only assertion anywhere that the SAMPLER turns a stream into a frame, rather than a
      # test hand-posting the events a sampler would have produced.
      - name: upload validation reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            data/validate_report.txt
            data/validate_rbac.txt
            data/validate_ingest_provenance.txt
            data/validate_logs/
          retention-days: 7
          if-no-files-found: ignore
