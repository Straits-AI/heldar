name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt · clippy · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked
      - name: read-seam lint (cross-app reads go through *_read views)
        run: ./scripts/check-read-seam.sh
      - name: open build (no proprietary verticals) compiles
        run: cargo build -p heldar-server --no-default-features --locked
      - name: open build stays lean (no wasm runtime linked by default)
        run: |
          if cargo tree -p heldar-server --no-default-features | grep -q wasmi; then
            echo "::error::wasmi is linked into the default/open heldar-server build"; exit 1
          fi
      - name: wasm plugin host compiles + lints
        run: cargo clippy -p heldar-server --features wasm --all-targets --locked -- -D warnings

  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 (rsa, Marvin timing side-channel): UNREACHABLE — `rsa` is pulled
          # into Cargo.lock only by `sqlx-mysql`, and this is a sqlite-only build
          # (sqlx default-features = false), so the vulnerable RSA code is never compiled.
          # No upstream fix exists. Re-evaluate (and drop this ignore) if a MySQL/Postgres
          # driver is ever enabled, or once a fixed `rsa` ships. Verify unreachability with:
          #   cargo tree -i rsa --all-features   # -> "nothing to print"
          ignore: RUSTSEC-2023-0071

  web:
    name: web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      # Unit lane (vitest). Currently guards the sidecar bridge's containment check — the function that
      # decides what a sandboxed plugin may ask the host to fetch with the operator's session.
      - run: npm run test:unit
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  e2e:
    name: playwright e2e (synthetic stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The e2e webServer (scripts/e2e_stack.sh) boots MediaMTX + synthetic ffmpeg cameras + the core.
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Provision the MediaMTX binary into infra/mediamtx/ exactly where the stack script expects it
      # ($ROOT/infra/mediamtx/mediamtx), auto-detecting the runner's OS/arch.
      - name: provision MediaMTX
        run: ./scripts/setup_mediamtx.sh
      # scripts/e2e_stack.sh runs the debug binary at target/debug/heldar-core.
      - name: build heldar-core (debug)
        run: cargo build --locked --bin heldar-core
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      # The stack serves the dashboard from apps/web/dist (HELDAR_WEB_DIR), so build it before the run.
      - name: build dashboard (dist for the stack)
        working-directory: apps/web
        run: npm run build
      - name: install Playwright chromium + system deps
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: playwright e2e
        working-directory: apps/web
        run: npm run test:e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The SECURE counterpart of the job above. It exists because that one runs HTTP with auth off, and
  # a mixed-content failure is structurally invisible in that configuration: MediaMTX serves HLS/WebRTC
  # on plaintext ports, so absolute http:// media URLs on an HTTPS dashboard are blocked by the browser
  # and live view dies. That regression shipped once already. This job serves the dashboard over real
  # TLS (Caddy, self-signed) with kernel auth ENABLED, so it can see it.
  e2e-tls:
    name: playwright e2e (HTTPS + auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: provision MediaMTX
        run: ./scripts/setup_mediamtx.sh
      # Caddy terminates the TLS the suite is about. The pinned version tracks deploy/compose.tls.yml.
      - name: provision Caddy
        run: ./scripts/setup_caddy.sh
      - name: build heldar-core (debug)
        run: cargo build --locked --bin heldar-core
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      - name: build dashboard (dist for the stack)
        working-directory: apps/web
        run: npm run build
      - name: install Playwright chromium + system deps
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: playwright e2e (TLS)
        working-directory: apps/web
        run: npm run test:e2e:tls
      - name: upload playwright report (TLS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tls
          path: apps/web/playwright-report/
          retention-days: 7

  integration:
    name: integration (validate.sh · rbac against synthetic camera)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Same provisioning as the e2e stack: MediaMTX binary + the debug core the scripts invoke.
      - name: provision MediaMTX
        run: ./scripts/setup_mediamtx.sh
      - name: build heldar-core (debug)
        run: cargo build --locked --bin heldar-core
      # Full media validation: boots MediaMTX + a synthetic RTSP camera + the core, records, and
      # exercises snapshot/clip/HLS. validate.sh was patched to track a failure counter and exit
      # non-zero on any failed Stage 0 guarantee, so this step fails CI on a bad build.
      - name: media validation (scripts/validate.sh)
        run: ./scripts/validate.sh
      # RBAC validation is fully self-contained: it starts its own auth-enabled core on :8001 with a
      # temp DB (no MediaMTX/camera needed) and prints PASS/FAIL lines. It does not exit non-zero on a
      # failed assertion, so gate on FAIL markers in its report.
      - name: rbac validation (scripts/validate_rbac.sh)
        run: |
          ./scripts/validate_rbac.sh
          if grep -Eq '(^|[[:space:]])FAIL ' data/validate_rbac.txt; then
            echo "::error::validate_rbac.sh reported one or more FAIL assertions"
            grep -E '(^|[[:space:]])FAIL ' data/validate_rbac.txt || true
            exit 1
          fi
      # Ingest-provenance validation is self-contained in the same way: it starts its own
      # auth-enabled cores on :8011 (enforce) and :8012 (warn) with temp DBs, needs no MediaMTX and no
      # camera, and prints PASS/FAIL lines. Both tiers are asserted, because "warn behaves exactly as
      # today" is as much a contract as "enforce refuses a ticketless batch". Same gating style as
      # validate_rbac.sh: it does not exit non-zero on a failed assertion, so gate on FAIL markers.
      - name: ingest provenance validation (scripts/validate_ingest_provenance.sh)
        run: |
          ./scripts/validate_ingest_provenance.sh
          if grep -Eq '(^|[[:space:]])FAIL ' data/validate_ingest_provenance.txt; then
            echo "::error::validate_ingest_provenance.sh reported one or more FAIL assertions"
            grep -E '(^|[[:space:]])FAIL ' data/validate_ingest_provenance.txt || true
            exit 1
          fi
      # Upgrade + disaster-recovery qualification. Boots PREVIOUS RELEASES' musl binaries against a
      # fresh DB, seeds through their API, then boots the current build on that same database — the only
      # test that exercises the migration chain against a database an older release actually wrote. Then
      # backup -> destroy -> restore, with a control boot proving the wipe was real (without it, a
      # restore that silently did nothing would still pass). Exits non-zero itself, so no FAIL-grep.
      - name: upgrade + restore drills (scripts/validate_upgrade_restore.sh)
        run: ./scripts/validate_upgrade_restore.sh
      - name: upload upgrade/restore report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-restore-report
          path: data/validate_upgrade_restore.txt
          retention-days: 7
      # The subsystem gate (#113): boots ONE synthetic stack and runs the zone, entry, movement and
      # search validations against it. Those four used to be skipped here for a harness reason — they
      # assumed a running dev box and a real camera — which was true, and also hid that they asserted
      # NOTHING. They logged HTTP codes for a human and exited 0 regardless, so running them would
      # have produced a gate that could not fail. validate_zones had been sending a `kind` the API
      # stopped accepting, creating no zone at all, and "passing" throughout.
      #
      # They assert now, and the gate refuses a script that produces no RESULT marker — "it ran" is
      # not "it passed".
      - name: subsystem gate (zones · entry · movement · search)
        run: ./scripts/validate_subsystems.sh
      - name: upload subsystem report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-report
          path: data/validate_subsystems.txt
          retention-days: 7
      # Still NOT run in CI:
      #   - validate_ai.sh: needs a REAL camera actively streaming so the sampler produces frames —
      #     real hardware, cannot be satisfied synthetically here.
      - name: upload validation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            data/validate_report.txt
            data/validate_rbac.txt
            data/validate_ingest_provenance.txt
            data/validate_logs/
          retention-days: 7
          if-no-files-found: ignore
