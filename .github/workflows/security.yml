name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so advisories published after a merge still surface without a new commit.
    - cron: "0 6 * * 1"

# Least privilege by default: every job only reads the repo. Jobs that upload SARIF opt into
# security-events: write locally (see the trivy job).
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-audit:
    name: js deps (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # Fail on high/critical advisories in the dashboard's dependency tree.
      - name: npm audit (high+)
        working-directory: apps/web
        run: npm audit --audit-level=high

  pip-audit:
    name: python deps (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      # Only the core AI worker runtime is audited here. The heavy optional model stacks (torch,
      # opencv, YOLO/OCR in requirements.txt / requirements-anpr.txt / requirements-embed.txt) are
      # imported lazily by worker.py and are intentionally NOT baked into the container image, so they
      # are out of scope for this gate. Add them here only if/when they ship in the image.
      - name: pip-audit (requirements-core.txt)
        run: pip-audit -r apps/ai/requirements-core.txt

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit on the ref, not just the tip.
          fetch-depth: 0
      # The gitleaks CLI is MIT-licensed, but gitleaks-action@v2 refuses to run for an
      # ORGANIZATION without a paid GITLEAKS_LICENSE secret. Invoke the binary directly so the
      # gate works on a fork or a licence-less org; pinned by version for reproducibility.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_${VERSION}_linux_x64.tar.gz, from the release's published checksums.
          # A security gate that installs an unverified binary over the network is not a gate — it is
          # a supply-chain hole in the thing meant to close one. Bumping the version means bumping
          # this too; a mismatch fails the job rather than scanning with an unknown binary.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Retry with backoff: the download is a runner->github.com hop that has already flaked
          # (503, then repeated "connection died"), and a transient network blip must not read as a
          # failed secret scan. Downloaded to a file first so it can be verified BEFORE extraction —
          # piping straight into tar leaves nothing to check.
          for attempt in 1 2 3 4 5; do
            if curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors -o gitleaks.tar.gz "$url"; then
              break
            fi
            echo "gitleaks download attempt $attempt failed; retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          [ -s gitleaks.tar.gz ] || { echo "::error::could not download gitleaks after 5 attempts"; exit 1; }
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version
      # `git` mode scans full history (fetch-depth: 0 above). Non-zero exit = leaks found.
      - name: gitleaks scan
        run: gitleaks git --redact --verbose --exit-code 1 .

  trivy-fs:
    name: filesystem scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job uploads SARIF to the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
