name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so advisories published after a merge still surface without a new commit.
    - cron: "0 6 * * 1"

# Least privilege by default: every job only reads the repo. Jobs that upload SARIF opt into
# security-events: write locally (see the trivy job).
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-audit:
    name: js deps (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # Fail on high/critical advisories in the dashboard's dependency tree.
      - name: npm audit (high+)
        working-directory: apps/web
        run: npm audit --audit-level=high

  pip-audit:
    name: python deps (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The locks are compiled for this interpreter and for linux x86_64 (see
          # scripts/lock_ai_profiles.sh). Auditing them on a different platform resolves a different
          # tree — on macOS the nvidia-* CUDA wheels disappear entirely — so this must match.
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit

      # The gate used to audit requirements-core.txt and nothing else, so torch, opencv, the CUDA
      # wheels and PaddleOCR — the largest and fastest-moving native trees in the product — were
      # outside it (#114). Auditing the requirements files directly would not have fixed that: they
      # carry open floors, so the answer changes with the resolver's mood. We audit committed locks,
      # and these two checks are what keep those locks meaningful.
      - name: AI profile locks are present, pinned and current
        run: python3 scripts/check_ai_locks.py
      - name: exceptions register is valid and nothing has expired
        run: python3 scripts/check_security_exceptions.py

      # Every documented profile, not just the first that fails: a release blocked on `detect`
      # should already know whether `anpr` and `embed` are also affected.
      - name: pip-audit every shippable AI profile
        run: |
          set -uo pipefail
          # An empty register is the normal case, so every array expansion below has to survive a
          # zero-length array under `set -u`. Note "${arr[@]}" and NOT "${arr[@]:-}": the latter
          # expands an empty array to one EMPTY STRING argument, which pip-audit takes as a
          # positional and rejects. Bash 5 (every GitHub runner) expands the former to nothing.
          ignore_args=()
          while IFS= read -r id; do
            [ -n "$id" ] && ignore_args+=(--ignore-vuln "$id")
          done < <(python3 scripts/check_security_exceptions.py --ignore-ids --ecosystem pip)
          if [ ${#ignore_args[@]} -gt 0 ]; then
            echo "suppressing $(( ${#ignore_args[@]} / 2 )) accepted advisory/advisories from the register"
          fi

          failed=()
          while IFS=$'\t' read -r profile _inputs; do
            echo "::group::pip-audit — $profile"
            if pip-audit --no-deps -r "apps/ai/constraints/${profile}.lock" "${ignore_args[@]}"; then
              echo "$profile: clean"
            else
              failed+=("$profile")
            fi
            echo "::endgroup::"
          done < <(python3 scripts/check_ai_locks.py --profiles)

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::vulnerable dependencies in AI profile(s): ${failed[*]}"
            echo "Fix by upgrading, or accept explicitly in security/dependency-exceptions.json" >&2
            exit 1
          fi
          echo "all AI profiles clean"

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit on the ref, not just the tip.
          fetch-depth: 0
      # The gitleaks CLI is MIT-licensed, but gitleaks-action@v2 refuses to run for an
      # ORGANIZATION without a paid GITLEAKS_LICENSE secret. Invoke the binary directly so the
      # gate works on a fork or a licence-less org; pinned by version for reproducibility.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_${VERSION}_linux_x64.tar.gz, from the release's published checksums.
          # A security gate that installs an unverified binary over the network is not a gate — it is
          # a supply-chain hole in the thing meant to close one. Bumping the version means bumping
          # this too; a mismatch fails the job rather than scanning with an unknown binary.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Retry with backoff: the download is a runner->github.com hop that has already flaked
          # (503, then repeated "connection died"), and a transient network blip must not read as a
          # failed secret scan. Downloaded to a file first so it can be verified BEFORE extraction —
          # piping straight into tar leaves nothing to check.
          for attempt in 1 2 3 4 5; do
            if curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors -o gitleaks.tar.gz "$url"; then
              break
            fi
            echo "gitleaks download attempt $attempt failed; retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          [ -s gitleaks.tar.gz ] || { echo "::error::could not download gitleaks after 5 attempts"; exit 1; }
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version
      # `git` mode scans full history (fetch-depth: 0 above). Non-zero exit = leaks found.
      - name: gitleaks scan
        run: gitleaks git --redact --verbose --exit-code 1 .

  trivy-fs:
    name: filesystem scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job uploads SARIF to the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # --- gate self-test ---------------------------------------------------------------------
      # `exit-code: "1"` on the real scan below was ABSENT for a long time: the job produced SARIF,
      # the dashboard filled up, and every PR showed green. A gate that never fails and a gate that
      # cannot fail look identical from the outside, and this one's failure path had never once
      # executed. So run the same action, at the same version, with the same verdict-affecting
      # inputs, against two fixtures whose answer is known.
      #
      # The clean fixture is not redundant: without it, a Trivy that failed on everything — a broken
      # DB download, a bad flag — would satisfy "the vulnerable fixture failed" and prove nothing.
      #
      # scripts/check_trivy_gate.py asserts these inputs still match the real scan. Without that the
      # self-test could go on passing against a configuration nobody ships.
      - name: self-test — the seeded vulnerable fixture MUST fail the scan
        id: seeded
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: scripts/fixtures/trivy-gate/vulnerable
          format: sarif
          output: selftest-seeded.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: self-test — the clean fixture MUST pass the scan
        id: clean
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: scripts/fixtures/trivy-gate/clean
          format: sarif
          output: selftest-clean.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: the gate blocks on a real finding, and only on a real finding
        env:
          SEEDED: ${{ steps.seeded.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          set -uo pipefail
          failures=0
          if [ "$SEEDED" != "failure" ]; then
            echo "::error::Trivy did NOT fail on scripts/fixtures/trivy-gate/vulnerable (outcome: $SEEDED)."
            echo "Either exit-code has been dropped from the scan, or the fixture has gone stale." >&2
            echo "Do not delete the fixture — add an older package. See scripts/fixtures/trivy-gate/README.md" >&2
            failures=$((failures + 1))
          fi
          if [ "$CLEAN" != "success" ]; then
            echo "::error::Trivy failed on scripts/fixtures/trivy-gate/clean (outcome: $CLEAN)."
            echo "The scanner is red on everything, so a failing seeded fixture would prove nothing." >&2
            echo "Bump the clean fixture's pins, or investigate the scanner itself." >&2
            failures=$((failures + 1))
          fi
          [ "$failures" -eq 0 ] || exit 1
          echo "gate self-test passed: blocks on the vulnerable fixture, clean on the clean one"
      # --- end gate self-test -----------------------------------------------------------------

      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # `website/` is the Docusaurus docs site. Its 24 HIGH findings are Docusaurus's own
          # transitives — webpack-dev-server, sockjs, uuid — i.e. BUILD tooling. `docusaurus build`
          # emits static HTML/JS, so none of it reaches the deployed Worker, and none is fixable
          # without a Docusaurus major bump. Blocking every product PR on a dev server that never
          # ships is how a gate gets switched off for real. Not silently ignored: the dashboard still
          # shows them via the SARIF upload below. Drop this the day the docs site gains a runtime
          # dependency, or Docusaurus ships the bump.
          skip-dirs: website,scripts/fixtures
          # Blocking. Without this the job produced SARIF and reported SUCCESS, so a HIGH/CRITICAL
          # finding lived on the code-scanning dashboard while the PR showed green. The upload below
          # is `if: always()`, so the finding is still published when this fails.
          exit-code: "1"
      - name: upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
