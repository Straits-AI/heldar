name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so advisories published after a merge still surface without a new commit.
    - cron: "0 6 * * 1"

# Least privilege by default: every job only reads the repo. Jobs that upload SARIF opt into
# security-events: write locally (see the trivy job).
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-audit:
    name: js deps (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # Fail on high/critical advisories in the dashboard's dependency tree.
      - name: npm audit (high+)
        working-directory: apps/web
        run: npm audit --audit-level=high

  pip-audit:
    name: python deps (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      # Only the core AI worker runtime is audited here. The heavy optional model stacks (torch,
      # opencv, YOLO/OCR in requirements.txt / requirements-anpr.txt / requirements-embed.txt) are
      # imported lazily by worker.py and are intentionally NOT baked into the container image, so they
      # are out of scope for this gate. Add them here only if/when they ship in the image.
      - name: pip-audit (requirements-core.txt)
        run: pip-audit -r apps/ai/requirements-core.txt

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit on the ref, not just the tip.
          fetch-depth: 0
      # The gitleaks CLI is MIT-licensed, but gitleaks-action@v2 refuses to run for an
      # ORGANIZATION without a paid GITLEAKS_LICENSE secret. Invoke the binary directly so the
      # gate works on a fork or a licence-less org; pinned by version for reproducibility.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # `git` mode scans full history (fetch-depth: 0 above). Non-zero exit = leaks found.
      - name: gitleaks scan
        run: gitleaks git --redact --verbose --exit-code 1 .

  trivy-fs:
    name: filesystem scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job uploads SARIF to the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
