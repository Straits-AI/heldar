name: Docker (open images)

# Build + push the OPEN multi-arch images (kernel + generic apps only — NO proprietary vertical) to
# the PUBLIC ghcr packages. Runs ONLY in the generated public repo `Straits-AI/heldar` — a no-op in the
# private monorepo (which builds the full images via docker.yml). The images are OPEN by construction:
# this workflow builds the public tree, from which prepare-open-repo.sh has already removed the vertical
# crate and its manifest entries.
#
# NOTE (one-time, after the first successful push): flip the new ghcr packages
# `heldar-core` / `heldar-web` / `heldar-ai` to Public visibility in the org's package settings so
# `docker compose up` can pull them without auth.
#
# Triggers:
#   * push a version tag   ->  build + push
#   * manual dispatch      ->  build only, unless push=true
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to ghcr (false = build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  # Keyless Sigstore signing of the image digest.
  id-token: write
  attestations: write

concurrency:
  group: docker-open-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same reasoning as release.yml: a pushed image tag is pulled by whoever trusts it, and `latest`
  # moves under everyone at once. A build-only dispatch reports without blocking.
  security-gate:
    name: security scan is green for this commit
    if: github.repository == 'Straits-AI/heldar'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/require-security-run
        with:
          sha: ${{ github.sha }}
          enforce: ${{ github.event_name == 'push' || inputs.push }}

  images:
    needs: security-gate
    if: github.repository == 'Straits-AI/heldar'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: heldar-core
            context: .
            dockerfile: Dockerfile
          - name: heldar-web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - name: heldar-ai
            context: ./apps/ai
            dockerfile: ./apps/ai/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/straits-ai/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build + push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only for images we actually PUSHED — there is no registry digest to attest otherwise, and a
      # dry-run build would fail the step for no reason.
      - name: SBOM
        if: steps.build.outputs.digest != ''
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/straits-ai/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: false
          # Symmetric with release.yml. Harmless today (the upload loop only walks THIS run's
          # artifacts, and there are none), but flipping upload-artifact on later would start racing
          # release.yml for the same tag's release with only `contents: read` to do it with.
          upload-release-assets: false

      # Attested against the DIGEST, not a tag. A tag is mutable — attesting one would certify
      # whatever it points at today, which is exactly the substitution this is meant to detect.
      - name: Attest build provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/straits-ai/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        if: steps.build.outputs.digest != ''
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/straits-ai/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true
