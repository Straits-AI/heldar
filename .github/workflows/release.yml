name: Release

# Two CLI-friendly triggers:
#   * push a version tag      ->  real publish + GitHub Release   (git tag v0.2.0 && git push origin v0.2.0)
#   * manual dispatch          ->  defaults to a safe dry-run     (gh workflow run release.yml [-f dry_run=false])
# Auth is crates.io Trusted Publishing (OIDC) — NO long-lived token stored anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package + verify only (no publish)"
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release / read tags
  id-token: write   # required for crates.io Trusted Publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    # Only the canonical public repo publishes — a no-op in the private monorepo or any fork.
    if: github.repository == 'Straits-AI/heldar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ---- dry-run path (manual dispatch with dry_run=true): package + verify, never upload ----
      - name: Dry run (package + verify, no publish)
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for c in heldar-kernel heldar-entry heldar-movement heldar-search; do
            echo "::group::dry-run $c"
            cargo publish -p "$c" --locked --dry-run
            echo "::endgroup::"
          done

      # ---- publish path (tag push, or dispatch with dry_run=false) ----
      - name: Mint short-lived crates.io token (OIDC)
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish (dependency order, idempotent)
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_one() {
            local crate="$1" ver
            ver=$(cargo metadata --no-deps --format-version 1 \
                  | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')
            if curl -fsS -A heldar-ci "https://crates.io/api/v1/crates/${crate}/${ver}" >/dev/null 2>&1; then
              echo "::notice::${crate}@${ver} already on crates.io — skipping"
            else
              echo "::group::publish ${crate}@${ver}"
              cargo publish -p "$crate" --locked --token "$TOKEN"
              echo "::endgroup::"
            fi
          }
          # kernel first (the generic apps depend on it); `cargo publish` waits for the
          # index between crates, so the dependents resolve the just-published kernel.
          for c in heldar-kernel heldar-entry heldar-movement heldar-search; do
            publish_one "$c"
          done

      - name: GitHub Release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes

  binaries:
    name: open musl binaries
    needs: publish
    if: github.repository == 'Straits-AI/heldar' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless Sigstore signing: a short-lived OIDC identity instead of a private key living in
      # repository secrets, which is the thing #115 asks us not to have.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Build
        id: build
        uses: ./.github/actions/build-musl-binary
        with:
          target: ${{ matrix.target }}
          arch-label: ${{ matrix.arch }}
          version: ${{ github.ref_name }}
      # An SBOM answers "what is actually in this binary" without trusting our word for it. SPDX
      # because that is what `gh attestation` and most consumers ingest.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.build.outputs.asset }}
          format: spdx-json
          output-file: ${{ steps.build.outputs.asset }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Binds this exact byte-for-byte artifact to the repository, commit, workflow and tag that
      # produced it. A sha256 sidecar only detects corruption when you already trust where the
      # checksum came from; this authenticates the publisher.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.build.outputs.asset }}
      - name: Attest heldarctl
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.build.outputs.cli-asset }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: ${{ steps.build.outputs.asset }}
          sbom-path: ${{ steps.build.outputs.asset }}.spdx.json

      # The manifest is generated once, on the x86_64 leg, and pinned+attested like any other asset.
      #
      # It has to WAIT for the images first. docker-open.yml builds and pushes them on the same
      # `push: tags: ["v*"]` event as this workflow, and GitHub gives no ordering between two
      # workflows triggered by one push — so without this the generator asks ghcr for a digest that
      # has not been pushed yet, gets nothing, and REQUIRE_DIGESTS turns that into a failed job.
      # An unpinned manifest for a perfectly good release would be worse: it would ship, attested,
      # promising a pinning it does not carry.
      - name: Wait for the release images to be pushed
        if: matrix.arch == 'x86_64'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            missing=""
            for n in core web ai; do
              docker buildx imagetools inspect "ghcr.io/straits-ai/heldar-$n:$TAG" \
                --format '{{json .Manifest.Digest}}' >/dev/null 2>&1 || missing="$missing $n"
            done
            [ -z "$missing" ] && { echo "all images present"; exit 0; }
            echo "waiting for:$missing (attempt $i/60)"
            sleep 30
          done
          echo "images never appeared — docker-open.yml likely failed for this tag" >&2
          exit 1

      - name: Release manifest
        if: matrix.arch == 'x86_64'
        env:
          # A release manifest whose whole purpose is pinning must not ship unpinned.
          REQUIRE_DIGESTS: "1"
        run: ./scripts/gen_release_manifest.sh "${{ github.ref_name }}" > heldar-release-manifest.json
      - name: Attest the manifest
        if: matrix.arch == 'x86_64'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: heldar-release-manifest.json
      # The contract this release publishes, so the next release's diff has a baseline and an
      # integrator can generate a client without booting a box.
      - name: API contract
        if: matrix.arch == 'x86_64'
        run: |
          cargo test -p heldar-server --test openapi_contract write_the_served_document -- --exact
          cp target/openapi.json openapi.json
      - name: Upload the API contract
        if: matrix.arch == 'x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" openapi.json --clobber

      - name: Upload the manifest
        if: matrix.arch == 'x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" heldar-release-manifest.json --clobber

      # A release must not ship a sizing document whose camera counts no run supports (#119). The
      # gate recomputes each cited run's verdict from its raw measurements and refuses a claim whose
      # thresholds have moved since the run — so this cannot be satisfied by editing a number.
      - name: Capacity claims are backed by a run that passed
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bench/test_capacity_gate.py
          python3 scripts/verify_capacity_claims.py

      # The skill bundle ships as a release asset (#124), pinned to the contract this tag serves.
      # A skill is only meaningful against an API it was written for, and its frontmatter says which.
      - name: Package the skill bundle
        if: matrix.arch == 'x86_64'
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_skills.py
          tar -czf "heldar-skills-$TAG.tar.gz" skills
          sha256sum "heldar-skills-$TAG.tar.gz" > "heldar-skills-$TAG.tar.gz.sha256"
      - name: Attest the skill bundle
        if: matrix.arch == 'x86_64'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: heldar-skills-${{ github.ref_name }}.tar.gz
      - name: Upload the skill bundle
        if: matrix.arch == 'x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release upload "$TAG" "heldar-skills-$TAG.tar.gz" "heldar-skills-$TAG.tar.gz.sha256" --clobber

      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.build.outputs.asset }}
          CLI: ${{ steps.build.outputs.cli-asset }}
          ARCH_LABEL: ${{ matrix.arch }}
        shell: bash
        run: |
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET.spdx.json" --clobber
          # heldarctl ships for every architecture the core does (#122).
          gh release upload "$TAG" "$CLI" "$CLI.sha256" --clobber
          MCP="heldar-mcp-${TAG}-${ARCH_LABEL}-linux-musl"
          gh release upload "$TAG" "$MCP" "$MCP.sha256" --clobber
