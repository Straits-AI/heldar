name: Feature request
description: Propose an improvement to the kernel, a generic app, or the dashboard
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Alternatives you considered are welcome too.
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Who does this serve?
      description: Which kind of user benefits? (Vertical/client-specific features are out of scope here — see CONTRIBUTING.md.)
      options:
        - Self-hoster (homelab / small site)
        - Operator of a deployed box
        - App / plugin developer building on the kernel
        - Integrator (webhooks, sidecars, external systems)
        - Other (explain above)
    validations:
      required: true
