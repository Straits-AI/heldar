# This repo is the source of truth for the open platform, so dependency updates are actioned here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
